<style>
/* ---- palette (CONTRACTS.md) ---------------------------------------------------- */
:root {
  --rock: #7a5238;
  --deep: #2a1c14;
  --dusk: #5b3d6e;
  --night: #0a0c18;
  --rune: #7fe0ff;
  --gold: #d99a5b;
  --text: #f1e6d8;
  --muted: rgba(241, 230, 216, 0.62);
  --faint: rgba(241, 230, 216, 0.34);
  --danger: #ff6a5a;
  --serif: 'Cinzel', 'Trajan Pro', 'Times New Roman', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --stick: 136px;   /* stick ring diameter; the stamina arc lives on its rim */
  --knob: 56px;
  --edge: 18px;     /* distance from the screen edge to the control clusters */
}

/* ---- shell --------------------------------------------------------------------- */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--night);
  color: var(--text);
  font-family: var(--sans);
  overflow: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
}
body { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
#gl {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  outline: none;
}
button { font-family: inherit; }
button:focus { outline: none; }
button:focus-visible { outline: 2px solid var(--rune); outline-offset: 2px; }

/* ---- HUD ----------------------------------------------------------------------- */
#hud {
  position: fixed; inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.7s ease;
}
#hud.on { opacity: 1; }

#top {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(10px + var(--sat)) calc(64px + var(--sar)) 0 calc(16px + var(--sal));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: start;
}
#falls {
  justify-self: start;
  display: inline-flex; align-items: center; gap: 7px;
  margin-top: 8px;
  font: 600 11px/1 var(--sans);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--faint);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
  transition: color 0.4s;
}
#falls.some { color: var(--muted); }
#falls svg { width: 14px; height: 14px; opacity: 0.8; }
#falls b { font-family: var(--serif); font-size: 15px; letter-spacing: 0.02em; color: var(--text); font-weight: 700; }
#meter { justify-self: center; text-align: center; }
#height {
  font-family: var(--serif);
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75), 0 0 28px rgba(217, 154, 91, 0.18);
  white-space: nowrap;
}
#height small {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--muted);
  margin-left: 5px;
  vertical-align: 0.35em;
}
#runes {
  display: flex; gap: 8px;
  justify-content: center; align-items: center;
  margin-top: 10px;
  min-height: 12px;
}
#runes .dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1.5px solid rgba(217, 154, 91, 0.6);
  background: rgba(10, 12, 24, 0.4);
  box-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
  transition: background 0.5s, border-color 0.5s, box-shadow 0.5s, transform 0.5s;
}
#runes .dot.lit {
  background: var(--rune);
  border-color: var(--rune);
  box-shadow: 0 0 8px var(--rune), 0 0 20px rgba(127, 224, 255, 0.65);
}
#runes .dot.summit { border-radius: 2px; transform: rotate(45deg) scale(0.95); border-color: rgba(241, 230, 216, 0.7); }
#runes .dot.summit.lit { transform: rotate(45deg) scale(1.15); }
#runes .dot.pop { animation: runepop 0.9s ease-out; }
@keyframes runepop {
  0% { transform: scale(1); }
  35% { transform: scale(1.9); box-shadow: 0 0 22px var(--rune), 0 0 44px rgba(127, 224, 255, 0.9); }
  100% { transform: scale(1); }
}

#mute {
  position: fixed;
  top: calc(8px + var(--sat));
  right: calc(12px + var(--sar));
  z-index: 40;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(241, 230, 216, 0.22);
  background: rgba(20, 14, 11, 0.5);
  color: var(--muted);
  display: grid; place-items: center;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  transition: color 0.2s, border-color 0.2s, transform 0.1s;
  -webkit-appearance: none; appearance: none;
}
#mute:active { transform: scale(0.94); }
#mute svg { width: 18px; height: 18px; }
#mute .wave { transition: opacity 0.2s; }
#mute .slash { opacity: 0; transition: opacity 0.2s; }
#mute.muted { color: var(--gold); border-color: rgba(217, 154, 91, 0.5); }
#mute.muted .wave { opacity: 0.25; }
#mute.muted .slash { opacity: 1; }

#msg {
  position: absolute; left: 0; right: 0; top: 33%;
  padding: 0 28px;
  text-align: center;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(19px, 5.6vw, 30px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text);
  text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 0 32px rgba(127, 224, 255, 0.25);
  opacity: 0;
  transform: translateY(8px) scale(0.985);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
#msg.show { opacity: 1; transform: none; }
#msg.gold { color: var(--gold); }
#msg.rune { color: var(--rune); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.8), 0 0 36px rgba(127, 224, 255, 0.55); }

#vig {
  position: absolute; inset: -2px;
  background: radial-gradient(ellipse at center, rgba(120, 12, 8, 0) 36%, rgba(130, 14, 10, 0.5) 70%, rgba(110, 8, 8, 0.92) 100%);
  opacity: 0;
  transition: opacity 0.35s;
}
#vig.beat { animation: heartbeat 0.9s ease-in-out infinite; }
@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  12% { transform: scale(1.02); }
  24% { transform: scale(1); }
  36% { transform: scale(1.015); }
}
#fallflash {
  position: absolute; inset: 0;
  background: rgba(10, 12, 24, 0.55);
  opacity: 0;
  transition: opacity 0.25s;
}
#hud.falling #fallflash { opacity: 1; }

/* control clusters: GRIP pill above a stick ring, one per thumb */
.ctl {
  position: absolute;
  bottom: calc(var(--edge) + var(--sab));
  display: flex; flex-direction: column; align-items: center;
  gap: 14px;
  pointer-events: none;
}
#ctl-l { left: calc(var(--edge) + var(--sal)); }
#ctl-r { right: calc(var(--edge) + var(--sar)); }

.grip {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: var(--stick); height: 46px;
  padding: 0 12px 0 24px; /* room for the state lamp on the left */
  border-radius: 999px;
  border: 1.5px solid rgba(241, 230, 216, 0.26);
  background: rgba(20, 14, 11, 0.56);
  color: var(--muted);
  font: 700 12.5px/1 var(--sans);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  text-indent: 0.3em; /* optical centering with the trailing letter-space */
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition: background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s, transform 0.1s;
  -webkit-appearance: none; appearance: none;
  cursor: pointer;
  overflow: hidden;
}
.grip::before {
  /* state lamp on the left of the label */
  content: '';
  position: absolute; left: 14px; top: 50%;
  width: 7px; height: 7px; margin-top: -3.5px;
  border-radius: 50%;
  background: rgba(241, 230, 216, 0.22);
  box-shadow: none;
  transition: background 0.18s, box-shadow 0.18s;
}
.grip .key {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  min-width: 12px;
  padding: 2px 5px;
  border-radius: 5px;
  border: 1px solid currentColor;
  font: 700 9px/1 var(--sans);
  letter-spacing: 0;
  text-indent: 0;
  opacity: 0.55;
}
.grip.gripping .key { opacity: 0.75; }
.grip.keyed { padding-right: 40px; }
.grip.gripping, .grip.slipping { font-size: 11.5px; letter-spacing: 0.2em; text-indent: 0.2em; }
.grip:active { transform: scale(0.97); }
.grip.hover { border-color: rgba(127, 224, 255, 0.55); color: var(--text); }
.grip.hover::before { background: var(--rune); box-shadow: 0 0 8px var(--rune); }
.grip.armed { border-color: var(--rune); color: var(--rune); animation: armed 1.1s ease-in-out infinite; }
.grip.armed::before { background: var(--rune); box-shadow: 0 0 10px var(--rune); }
.grip.gripping {
  background: linear-gradient(180deg, #edb473 0%, #c98748 55%, #a86a35 100%);
  color: #2a1c14;
  border-color: rgba(255, 220, 170, 0.9);
  box-shadow: 0 0 24px rgba(217, 154, 91, 0.55), 0 6px 20px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.grip.gripping::before { background: #2a1c14; box-shadow: 0 0 0 2px rgba(255, 235, 200, 0.5); }
.grip.slipping {
  background: linear-gradient(180deg, #ff8a78 0%, #d2452f 100%);
  color: #fff4ee;
  border-color: #ffc0b4;
  animation: slip 0.32s linear infinite;
}
.grip.slipping::before { background: #fff; box-shadow: 0 0 8px #fff; }
.grip.miss { animation: shake 0.36s ease-in-out; }
@keyframes armed {
  0%, 100% { box-shadow: 0 0 0 0 rgba(127, 224, 255, 0), 0 6px 20px rgba(0, 0, 0, 0.38); }
  50% { box-shadow: 0 0 18px 2px rgba(127, 224, 255, 0.55), 0 6px 20px rgba(0, 0, 0, 0.38); }
}
@keyframes slip {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.35); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

.stick {
  pointer-events: auto;
  touch-action: none;
  position: relative;
  width: var(--stick); height: var(--stick);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, rgba(42, 28, 20, 0.62), rgba(10, 12, 24, 0.5) 72%);
  box-shadow: inset 0 0 0 1px rgba(241, 230, 216, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.35), 0 10px 32px rgba(0, 0, 0, 0.4);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  cursor: grab;
}
.stick:active { cursor: grabbing; }
.stick.crit {
  box-shadow: inset 0 0 0 1px rgba(255, 106, 90, 0.55), inset 0 0 36px rgba(120, 10, 10, 0.55), 0 10px 32px rgba(0, 0, 0, 0.4), 0 0 26px rgba(255, 106, 90, 0.4);
  animation: critring 0.6s ease-in-out infinite;
}
@keyframes critring {
  0%, 100% { box-shadow: inset 0 0 0 1px rgba(255, 106, 90, 0.55), inset 0 0 36px rgba(120, 10, 10, 0.55), 0 10px 32px rgba(0, 0, 0, 0.4), 0 0 26px rgba(255, 106, 90, 0.4); }
  50% { box-shadow: inset 0 0 0 1px rgba(255, 106, 90, 0.25), inset 0 0 20px rgba(120, 10, 10, 0.3), 0 10px 32px rgba(0, 0, 0, 0.4), 0 0 8px rgba(255, 106, 90, 0.1); }
}
.stick svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  transform: rotate(-90deg); /* arcs start at 12 o'clock and run clockwise */
  pointer-events: none;
  overflow: visible;
}
.stick .track { fill: none; stroke: rgba(241, 230, 216, 0.13); stroke-width: 4; }
.stick .arc {
  fill: none;
  stroke: var(--gold);
  stroke-width: 4;
  stroke-linecap: round;
  transition: stroke 0.35s;
  filter: drop-shadow(0 0 4px rgba(217, 154, 91, 0.7));
}
.stick .arc.low { stroke: #ff9a4a; filter: drop-shadow(0 0 5px rgba(255, 154, 74, 0.7)); }
.stick .arc.crit { stroke: var(--danger); filter: drop-shadow(0 0 7px rgba(255, 106, 90, 0.9)); animation: critarc 0.6s ease-in-out infinite; }
@keyframes critarc {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
.stick .side {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--serif);
  font-weight: 700;
  font-size: 30px;
  color: rgba(241, 230, 216, 0.14);
  pointer-events: none;
}
.stick .knob {
  position: absolute; left: 50%; top: 50%;
  width: var(--knob); height: var(--knob);
  margin: calc(var(--knob) / -2) 0 0 calc(var(--knob) / -2);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #f7ecdc 0%, #d99a5b 48%, #8a5a34 100%);
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.55), inset 0 -3px 6px rgba(0, 0, 0, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.4);
  pointer-events: none;
  will-change: transform;
  transition: transform 0.05s linear, box-shadow 0.2s;
}
.stick .knob::after {
  content: '';
  position: absolute; inset: 30%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(42, 28, 20, 0.55), rgba(42, 28, 20, 0.1));
}
.stick.active .knob { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.6), 0 0 18px rgba(217, 154, 91, 0.45), inset 0 -3px 6px rgba(0, 0, 0, 0.28), inset 0 2px 3px rgba(255, 255, 255, 0.4); }

/* ---- overlays: title + end ------------------------------------------------------ */
.overlay {
  position: fixed; inset: 0;
  z-index: 20;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: calc(28px + var(--sat)) 22px calc(48px + var(--sab));
  background:
    radial-gradient(ellipse at 50% 38%, rgba(91, 61, 110, 0.28), rgba(10, 12, 24, 0) 60%),
    linear-gradient(180deg, rgba(10, 12, 24, 0.58) 0%, rgba(10, 12, 24, 0.82) 55%, rgba(10, 12, 24, 0.95) 100%);
  transition: opacity 0.9s ease;
  overflow: hidden;
  touch-action: manipulation; /* taps only: no double-tap zoom on iOS */
}
.overlay[hidden] { display: none; }
.overlay.hide { opacity: 0; pointer-events: none; }
.overlay .inner { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 460px; }
#title { cursor: pointer; }
.eyebrow {
  font: 600 12px/1 var(--sans);
  letter-spacing: 0.46em;
  text-indent: 0.46em;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.6);
}
.overlay h1 {
  margin: 12px 0 0;
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(44px, 14.5vw, 104px);
  line-height: 0.95;
  letter-spacing: 0.035em;
  background: linear-gradient(180deg, #fff6e8 0%, #f1e6d8 38%, #d99a5b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 8px 26px rgba(0, 0, 0, 0.65));
  white-space: nowrap;
}
#end h1 { font-size: clamp(28px, 8.4vw, 56px); white-space: normal; letter-spacing: 0.08em; }
.sigil {
  width: clamp(84px, 24vw, 118px); height: auto;
  margin: 24px 0 20px;
  filter: drop-shadow(0 0 16px rgba(127, 224, 255, 0.75));
  animation: breathe 4.5s ease-in-out infinite;
}
#end .sigil { margin: 16px 0 12px; width: clamp(64px, 18vw, 90px); }
@keyframes breathe {
  0%, 100% { filter: drop-shadow(0 0 12px rgba(127, 224, 255, 0.55)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 26px rgba(127, 224, 255, 0.95)); transform: scale(1.03); }
}
.card {
  width: 100%;
  box-sizing: border-box;
  background: rgba(20, 14, 11, 0.6);
  border: 1px solid rgba(217, 154, 91, 0.3);
  border-radius: 18px;
  padding: 16px 18px 15px;
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  text-align: left;
  color: var(--text);
}
.card h2 {
  margin: 0 0 12px;
  font: 600 10.5px/1 var(--sans);
  letter-spacing: 0.36em;
  text-indent: 0.36em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
}
.card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.card .hand { font: 400 13px/1.45 var(--sans); color: var(--muted); }
.card .hand b {
  display: block;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: var(--gold);
  margin-bottom: 6px;
}
.card .hand em { font-style: normal; color: var(--text); font-weight: 600; }
.card .hand .grip-ico {
  display: inline-block;
  padding: 2px 8px 2px 7px;
  border: 1px solid rgba(241, 230, 216, 0.35);
  border-radius: 999px;
  font: 700 9.5px/1.2 var(--sans);
  letter-spacing: 0.24em;
  color: var(--text);
  vertical-align: 1px;
}
.card .demo { display: grid; grid-template-columns: 60px 1fr 60px; gap: 12px; align-items: center; }
.card .mini { display: flex; flex-direction: column; align-items: center; gap: 7px; }
.card .mini-pill {
  display: block; width: 54px; height: 18px;
  border-radius: 999px;
  border: 1px solid rgba(241, 230, 216, 0.35);
  background: rgba(20, 14, 11, 0.6);
  color: var(--muted);
  font: 700 7.5px/18px var(--sans);
  letter-spacing: 0.24em; text-indent: 0.24em; text-transform: uppercase; text-align: center;
}
.card .mini-pill.lit {
  background: linear-gradient(180deg, #edb473 0%, #c98748 55%, #a86a35 100%);
  color: #2a1c14; border-color: rgba(255, 220, 170, 0.9);
  box-shadow: 0 0 12px rgba(217, 154, 91, 0.5);
}
.card .mini-ring {
  position: relative; display: block; width: 54px; height: 54px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 42%, rgba(42, 28, 20, 0.9), rgba(10, 12, 24, 0.75) 72%);
  box-shadow: inset 0 0 0 1px rgba(241, 230, 216, 0.12), 0 6px 14px rgba(0, 0, 0, 0.4);
}
.card .mini-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.card .mini-ring svg circle { fill: none; stroke: var(--gold); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 160; }
.card .mini-ring i {
  position: absolute; left: 50%; top: 50%;
  width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #f7ecdc 0%, #d99a5b 48%, #8a5a34 100%);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
}
.card .mini-ring.push i { animation: minipush 2.6s ease-in-out infinite; }
@keyframes minipush {
  0%, 15%, 85%, 100% { transform: translate(0, 0); }
  40%, 60% { transform: translate(7px, -10px); }
}
.card .mini b { display: block; font: 700 8.5px/1 var(--sans); letter-spacing: 0.26em; text-indent: 0.26em; text-transform: uppercase; color: var(--gold); }
.card .steps { font: 400 13px/1.42 var(--sans); color: var(--muted); }
.card .steps p { display: flex; align-items: flex-start; gap: 7px; margin: 0 0 8px; }
.card .steps p:last-child { margin-bottom: 0; }
.card .steps em { font-style: normal; color: var(--text); font-weight: 600; }
.card .steps .n {
  flex: 0 0 17px;
  display: grid; place-items: center;
  width: 17px; height: 17px; margin-top: 1px;
  border-radius: 50%;
  border: 1px solid rgba(217, 154, 91, 0.55);
  background: rgba(217, 154, 91, 0.16);
  font: 700 9.5px/1 var(--sans);
  color: var(--gold);
}
.card .hint {
  margin: 12px 0 0;
  padding-top: 11px;
  border-top: 1px solid rgba(241, 230, 216, 0.1);
  font: 400 12px/1.5 var(--sans);
  color: var(--muted);
  text-align: center;
}
.card .hint i { color: var(--rune); font-style: normal; }
.card .keys { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 4px; }
kbd {
  display: inline-block;
  min-width: 14px;
  padding: 3px 6px;
  border-radius: 6px;
  border: 1px solid rgba(241, 230, 216, 0.3);
  border-bottom-width: 2px;
  background: rgba(241, 230, 216, 0.08);
  font: 600 11px/1 var(--sans);
  color: var(--text);
  text-align: center;
}
.card .keys .sep { color: var(--faint); margin: 0 3px; font-size: 11px; }
.card .stickico {
  display: inline-block; vertical-align: -3px;
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.5px solid rgba(217, 154, 91, 0.7);
  position: relative;
}
.card .stickico::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 6px; height: 6px; margin: -3px 0 0 -3px;
  border-radius: 50%; background: var(--gold);
}
.tap {
  margin-top: 24px;
  font: 600 12.5px/1 var(--sans);
  letter-spacing: 0.44em;
  text-indent: 0.44em;
  text-transform: uppercase;
  color: var(--rune);
  text-shadow: 0 0 18px rgba(127, 224, 255, 0.5);
  animation: pulse 1.9s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 1; }
}
.foot {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(12px + var(--sab));
  padding: 0 24px;
  font: 400 10.5px/1.55 var(--sans);
  color: rgba(241, 230, 216, 0.42);
  letter-spacing: 0.03em;
  text-align: center;
}
.foot a, .credits a { color: rgba(127, 224, 255, 0.8); text-decoration: none; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  margin: 18px 0 16px;
}
.stat {
  background: rgba(20, 14, 11, 0.55);
  border: 1px solid rgba(217, 154, 91, 0.25);
  border-radius: 14px;
  padding: 12px 6px 10px;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.stat b {
  display: block;
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(22px, 7vw, 30px);
  line-height: 1.1;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.stat span {
  display: block; margin-top: 5px;
  font: 600 9.5px/1 var(--sans);
  letter-spacing: 0.3em;
  text-indent: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}
.credits {
  width: 100%;
  box-sizing: border-box;
  font: 400 11.5px/1.6 var(--sans);
  color: var(--muted);
  text-align: left;
  padding: 12px 14px;
  border-radius: 14px;
  background: rgba(20, 14, 11, 0.45);
  border: 1px solid rgba(241, 230, 216, 0.08);
}
.credits h3 {
  margin: 0 0 6px;
  font: 600 9.5px/1 var(--sans);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: var(--gold);
}
.credits p { margin: 0 0 4px; }
.credits b { color: var(--text); font-weight: 600; }
.btn {
  margin-top: 18px;
  padding: 14px 30px;
  border-radius: 999px;
  border: 1px solid rgba(217, 154, 91, 0.7);
  background: linear-gradient(180deg, rgba(217, 154, 91, 0.22), rgba(217, 154, 91, 0.08));
  color: var(--text);
  font: 700 12.5px/1 var(--sans);
  letter-spacing: 0.34em;
  text-indent: 0.34em;
  text-transform: uppercase;
  cursor: pointer;
  -webkit-appearance: none; appearance: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  transition: transform 0.1s, background 0.2s;
}
.btn:active { transform: scale(0.97); }

/* ---- boot: shown until the title appears, so a slow LAN load is never a black screen ---- */
#boot {
  position: fixed; inset: 0;
  z-index: 15;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  background: radial-gradient(ellipse at 50% 40%, #2a1c2e 0%, var(--night) 70%);
  transition: opacity 0.8s ease;
  pointer-events: none;
}
#boot.hide { opacity: 0; }
#boot[hidden] { display: none; }
#boot .eyebrow { font-size: 11px; }
#boot .name { font-family: var(--serif); font-weight: 700; font-size: clamp(22px, 6vw, 34px); letter-spacing: 0.1em; color: var(--text); }
#boot .bar { width: min(220px, 50vw); height: 2px; border-radius: 2px; background: rgba(241, 230, 216, 0.12); overflow: hidden; }
#boot .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, var(--rune), transparent); animation: bootslide 1.6s ease-in-out infinite; }
@keyframes bootslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
#boot .note { font: 500 11px/1 var(--sans); letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase; color: var(--faint); }

/* ---- landscape phones: shorter controls, tighter title -------------------------- */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --stick: 112px; --knob: 48px; --edge: 14px; }
  .grip { height: 40px; font-size: 11.5px; }
  #height { font-size: 28px; }
  .overlay { padding-top: calc(12px + var(--sat)); padding-bottom: calc(30px + var(--sab)); }
  .overlay h1 { font-size: clamp(34px, 9vh, 64px); }
  .sigil { width: 56px; margin: 8px 0 8px; }
  .card { padding: 10px 14px 9px; }
  .card h2 { margin-bottom: 6px; }
  .card .hint { margin-top: 6px; padding-top: 6px; }
  .card .demo { grid-template-columns: 52px 1fr 52px; }
  .card .mini-ring { width: 44px; height: 44px; }
  .card .mini-ring i { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
  .card .steps { font-size: 12px; }
  .card .steps p { margin-bottom: 4px; }
  .tap { margin-top: 12px; }
  .foot { display: none; }
  .overlay .inner { max-width: 560px; }
}
/* very small portrait phones */
@media (max-width: 360px) {
  :root { --stick: 120px; --knob: 50px; --edge: 14px; }
}
/* large screens: keep the clusters thumb-sized but give the meter more presence */
@media (min-width: 900px) {
  :root { --stick: 150px; --knob: 60px; --edge: 34px; }
  #height { font-size: 40px; }
  #msg { font-size: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  .sigil, .tap, .grip.armed, .grip.slipping, .stick .arc.crit, .stick.crit, #vig.beat, #runes .dot.pop, .card .mini-ring.push i { animation: none; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- boot splash; hud.js removes it when the title screen shows (or on the first live frame) -->
<div id="boot" aria-hidden="true">
  <div class="eyebrow">Rock Climber</div>
  <div class="name">THE RITUAL</div>
  <div class="bar"><i></i></div>
  <div class="note">Loading the cliff</div>
</div>

<!-- in-game HUD; hud.js owns everything inside -->
<div id="hud" aria-hidden="true">
  <div id="fallflash"></div>
  <div id="vig"></div>
  <div id="top">
    <div id="falls" title="Falls caught by the rope">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1v5.5M8 6.5c-3 0-4 2.2-4 4.2 0 1.8 1.2 3.3 4 3.3s4-1.5 4-3.3c0-2-1-4.2-4-4.2z"/></svg>
      <span>Falls</span><b>0</b>
    </div>
    <div id="meter">
      <div id="height">0.0<small>m</small></div>
      <div id="runes"></div>
    </div>
    <div></div>
  </div>
  <div id="msg"></div>
  <div id="ctl-l" class="ctl">
    <button id="grip-l" class="grip" type="button" aria-label="Left hand grip">Grip</button>
    <div id="stick-l" class="stick" role="slider" aria-label="Left hand">
      <svg viewBox="0 0 136 136"><circle class="track" cx="68" cy="68" r="63"/><circle class="arc" cx="68" cy="68" r="63"/></svg>
      <span class="side">L</span>
      <div class="knob"></div>
    </div>
  </div>
  <div id="ctl-r" class="ctl">
    <button id="grip-r" class="grip" type="button" aria-label="Right hand grip">Grip</button>
    <div id="stick-r" class="stick" role="slider" aria-label="Right hand">
      <svg viewBox="0 0 136 136"><circle class="track" cx="68" cy="68" r="63"/><circle class="arc" cx="68" cy="68" r="63"/></svg>
      <span class="side">R</span>
      <div class="knob"></div>
    </div>
  </div>
</div>

<button id="mute" type="button" aria-label="Toggle sound" title="Sound (M)">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4.2 3.4a.6.6 0 0 0 1-.47V5.57a.6.6 0 0 0-1-.47L7.6 8.5H5a1 1 0 0 0-1 1z"/>
    <path class="wave" d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.6a7.6 7.6 0 0 1 0 10.8"/>
    <path class="slash" d="M3.5 3.5l17 17"/>
  </svg>
</button>

<!-- title screen; hud.js fills the controls card for touch or keyboard -->
<div id="title" class="overlay" hidden>
  <div class="inner">
    <div class="eyebrow">Rock Climber</div>
    <h1>The Ritual</h1>
    <svg class="sigil" viewBox="0 0 120 120" fill="none" stroke="#7fe0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="60" cy="60" r="55" opacity="0.55"/>
      <circle cx="60" cy="60" r="46" stroke-dasharray="2.5 6.5" opacity="0.5"/>
      <path d="M60 16v88"/>
      <path d="M60 46 38 24M60 46l22-22"/>
      <path d="M60 78 42 96M60 78l18 18" opacity="0.65"/>
      <path d="M30 60h60" opacity="0.4"/>
      <circle cx="60" cy="60" r="5.5" fill="#7fe0ff"/>
      <path d="M60 4l4.5 7-4.5 7-4.5-7z" fill="#7fe0ff" opacity="0.85"/>
      <circle cx="60" cy="112" r="2.5" fill="#7fe0ff" opacity="0.7"/>
    </svg>
    <div class="card" id="controls-card"></div>
    <div class="tap" id="tap">Tap to begin</div>
  </div>
  <div class="foot" id="title-foot"></div>
</div>

<!-- end screen; hud.js fills the stats and credits -->
<div id="end" class="overlay" hidden>
  <div class="inner">
    <div class="eyebrow">Rock Climber</div>
    <h1 id="end-title">The ritual is complete</h1>
    <svg class="sigil" viewBox="0 0 120 120" fill="none" stroke="#7fe0ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="60" cy="60" r="55" opacity="0.55"/>
      <circle cx="60" cy="60" r="46" stroke-dasharray="2.5 6.5" opacity="0.5"/>
      <path d="M60 16v88"/>
      <path d="M60 46 38 24M60 46l22-22"/>
      <path d="M60 78 42 96M60 78l18 18" opacity="0.65"/>
      <path d="M30 60h60" opacity="0.4"/>
      <circle cx="60" cy="60" r="5.5" fill="#7fe0ff"/>
    </svg>
    <div class="stats" id="end-stats"></div>
    <div class="credits" id="end-credits"></div>
    <button class="btn" id="end-restart" type="button">Climb again</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
